name: CI

on:
  push:
  pull_request:

jobs:
  # Mark this job ("Lint (ESLint)") as a required status check in branch
  # protection. It catches the class of bug #218/#219 spent two cleanup PRs
  # on: names nothing declares or imports, imports a module doesn't export,
  # duplicate declarations, and dead code (see eslint.config.mjs). Violations
  # that predate the gate are recorded in eslint-suppressions.json; anything
  # new fails, and fixing a recorded one requires `npm run lint:prune` so the
  # baseline only ever shrinks. Needs no `npm ci`: the config has no
  # dependencies beyond ESLint itself, which the script pins.
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run lint

  test:
    name: Check and test
    runs-on: ubuntu-latest
    # A hung integration test (server.test.js spawns real child processes)
    # once ran to GitHub's default 6-hour job timeout undetected. This caps
    # the blast radius; --test-timeout in package.json bounds individual
    # tests so a hang fails fast instead of reaching this ceiling at all.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: MCP server tests
        working-directory: mcp-server
        run: |
          npm ci
          npm test
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # Proves the Redis-backed store path (not the in-memory fallback) is correct
  # under real multi-process concurrent load. A real Redis service container is
  # required so claimJob/session/job-state races are shaped by genuine network
  # latency across separate OS processes, not single-process Promise interleaving.
  redis-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # There is no matrix in this job, so the old ${{ matrix.node-version }}
      # resolved to nothing and the runner's default Node was used.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test
