name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    # A hung integration test (server.test.js spawns real child processes)
    # once ran to GitHub's default 6-hour job timeout undetected. This caps
    # the blast radius; --test-timeout in package.json bounds individual
    # tests so a hang fails fast instead of reaching this ceiling at all.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: MCP server tests
        working-directory: mcp-server
        run: |
          npm ci
          npm test
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # Proves the Redis-backed store path (not the in-memory fallback) is correct
  # under real multi-process concurrent load. A real Redis service container is
  # required so claimJob/session/job-state races are shaped by genuine network
  # latency across separate OS processes, not single-process Promise interleaving.
  redis-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test
